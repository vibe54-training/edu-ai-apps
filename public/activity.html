<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학습활동 추천</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>학습활동 추천</h1>
    <nav>
      <a href="index.html">홈</a>
      <a href="quiz.html">퀴즈 생성기</a>
    </nav>
  </header>
  <main>
    <section>
      <h2>중3 보건 모둠 활동 추천</h2>
      <p>인터넷 없이 예시 활동 은행에서 선택합니다. 현재 감염병 예방 단원의 아래 차시 목표만 지원합니다. 활동 전 학급 상황과 안전을 확인해 주세요.</p>
      <form id="activity-form">
        <label for="unit">단원명</label>
        <select id="unit" required>
          <option value="">단원을 선택하세요</option>
          <option value="감염병 예방">감염병 예방</option>
        </select>
        <label for="goal">차시 목표</label>
        <select id="goal" required>
          <option value="">차시 목표를 선택하세요</option>
          <option value="손 씻기">올바른 손 씻기의 중요성과 방법을 설명한다.</option>
          <option value="전파 경로">감염병의 전파 경로와 예방 방법을 설명한다.</option>
        </select>
        <button type="submit">활동 추천</button>
      </form>
    </section>
    <section id="result" aria-live="polite">
      <h2>추천 결과</h2>
      <p>단원과 차시 목표를 선택하면 모둠 활동 3개가 표시됩니다. 다시 추천하면 같은 활동의 순서가 바뀔 수 있습니다.</p>
    </section>
  </main>
  <script src="activity.js" defer></script>
</body>
</html>
